name: Build Ghost 6 firmware (vertical UI)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get FB-G6 Marlin fork (pinned commit, portrait 320x480 UI)
        run: |
          git clone https://github.com/booroondook-eng/FlyingBear_Ghost-6-Marlin.git M
          cd M && git checkout c4f110fd4223eb16251861506c103dc064979448
      - name: Copy configs
        run: cp profiles/vertical/Configuration.h profiles/vertical/Configuration_adv.h M/Marlin/
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install platformio
      - name: Build
        run: cd M && pio run -e mks_robin_nano_v3
      - name: Rename for the Nano4 bootloader
        run: cp M/.pio/build/mks_robin_nano_v3/firmware.bin Robin_nano_4.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Robin_nano_4-vertical
          path: Robin_nano_4.bin
